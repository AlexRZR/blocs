<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Bloc Bonito</title>
  <link rel="stylesheet" href="cozy-ui.css" />
</head>
<body class="ui-theme">
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">✎</div>
        <div>
          <h1>Bloc's</h1>
          <div class="subtitle">Un sitio tranquilo para tus ideas.</div>
        </div>
      </div>
      <div class="ui-flex ui-gap-sm theme-actions">
        <button class="ui-btn ui-btn-sm ui-btn-pill" id="themeToggle" type="button" aria-label="Cambiar tema" aria-pressed="false">🌙 Oscuro</button>
        <div class="status" id="status">Guardado local automático ✓</div>
      </div>
    </header>

    <section class="shell">
      <aside class="sidebar">
        <div class="section-title">Notas</div>
        <button class="soft-btn active" data-note="principal">🌿 Principal</button>
        <button class="soft-btn" data-note="diario">☀ Diario</button>
        <button class="soft-btn" data-note="ideas">💡 Ideas</button>
        <button class="soft-btn" data-note="pendientes">✓ Pendientes</button>
      </aside>

      <section class="editor-card" id="editorCard">
        <div class="toolbar">
          <button class="action-btn green" id="newBtn">＋ Nueva</button>
          <button class="action-btn yellow" id="saveBtn">💾 Guardar</button>
          <button class="action-btn blue" id="copyBtn">⧉ Copiar</button>
          <button class="action-btn pink" id="clearBtn">⌫ Limpiar</button>
          <button class="action-btn pink" id="deleteCurrentBtn">🗑 Borrar nota</button>
        </div>

        <div class="entries-panel">
          <div class="entries-header">
            <h3>Entradas</h3>
            <div class="entries-header-actions">
              <button class="select-all-btn" id="selectAllBtn" type="button">Seleccionar todas</button>
              <button class="delete-selected-btn" id="deleteSelectedBtn" type="button">🗑 Seleccionadas</button>
            </div>
          </div>
          <div class="entries-list" id="entriesList"></div>
        </div>

        <input class="title-input" id="title" value="Nota principal" aria-label="Título de la nota"/>
        <div class="divider"></div>
        <textarea id="note" spellcheck="true" placeholder="Escribe algo bonito aquí..."></textarea>

        <div class="bottom-row">
          <span id="counter">0 caracteres</span>
          <button class="sound-toggle" id="soundBtn">🔊 Sonidos: sí</button>
        </div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop" id="deleteModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <h2 id="deleteModalTitle">¿Borrar nota?</h2>
      <p id="deleteModalText">Estás a punto de eliminar esta entrada.</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="cancelDeleteBtn" type="button">Cancelar</button>
        <button class="modal-btn confirm" id="confirmDeleteBtn" type="button">Sí, borrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Guardado ✓</div>

  <script>
    const title = document.getElementById('title');
    const note = document.getElementById('note');
    const counter = document.getElementById('counter');
    const toast = document.getElementById('toast');
    const status = document.getElementById('status');
    const editorCard = document.getElementById('editorCard');
    const soundBtn = document.getElementById('soundBtn');
    const entriesList = document.getElementById('entriesList');
    const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const deleteModal = document.getElementById('deleteModal');
    const deleteModalText = document.getElementById('deleteModalText');
    const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
    const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

    let activeKey = 'principal';
    let activeEntryId = null;
    let soundsEnabled = true;
    let saveTimer;
    const selectedEntryIds = new Set();
    let pendingDeleteAction = null;

    const categoryLabels = {
      principal: 'Principal',
      diario: 'Diario',
      ideas: 'Ideas',
      pendientes: 'Pendientes'
    };

    const defaults = {
      principal: [
        { id: 'principal-1', title: 'Nota principal', text: '' }
      ],
      diario: [
        { id: 'diario-1', title: 'Diario', text: '' }
      ],
      ideas: [
        { id: 'ideas-1', title: 'Ideas', text: '' }
      ],
      pendientes: [
        { id: 'pendientes-1', title: 'Pendientes', text: '' }
      ]
    };

    function makeId(prefix) {
      if (window.crypto && crypto.randomUUID) {
        return `${prefix}-${crypto.randomUUID()}`;
      }
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    const loadAll = () => {
      try {
        const raw = JSON.parse(localStorage.getItem('bloc-bonito-notes'));
        if (!raw) return structuredClone(defaults);

        const normalized = {};
        Object.keys(defaults).forEach(key => {
          const value = raw[key];
          if (Array.isArray(value)) {
            normalized[key] = value.map((entry, index) => ({
              id: entry.id || makeId(key),
              title: entry.title || `${categoryLabels[key]} ${index + 1}`,
              text: entry.text || '',
              createdAt: entry.createdAt || Date.now()
            }));
          } else if (value && typeof value === 'object') {
            normalized[key] = [{
              id: makeId(key),
              title: value.title || categoryLabels[key],
              text: value.text || '',
              createdAt: Date.now()
            }];
          } else {
            normalized[key] = [...defaults[key]];
          }
        });

        return normalized;
      } catch {
        return structuredClone(defaults);
      }
    };

    let notes = loadAll();

    function playTone(type = 'tap') {
      if (!soundsEnabled) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const frequencies = {
        tap: [520, 660],
        save: [660, 880],
        clear: [320, 240],
        switch: [440, 560]
      };

      const pair = frequencies[type] || frequencies.tap;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(pair[0], ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(pair[1], ctx.currentTime + 0.09);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.065, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.13);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.14);
      osc.onended = () => ctx.close();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function openDeleteModal(message, callback) {
      deleteModalText.textContent = message;
      pendingDeleteAction = callback;
      deleteModal.classList.add('show');
      deleteModal.setAttribute('aria-hidden', 'false');
    }

    function closeDeleteModal() {
      deleteModal.classList.remove('show');
      deleteModal.setAttribute('aria-hidden', 'true');
      pendingDeleteAction = null;
    }

    function updateCounter() {
      counter.textContent = `${note.value.length} caracteres`;
    }

    function saveList() {
      localStorage.setItem('bloc-bonito-notes', JSON.stringify(notes));
    }

    function updateDeleteControls() {
      const list = notes[activeKey] || [];
      const hasSelection = selectedEntryIds.size > 0;
      const allSelected = list.length > 0 && list.every(entry => selectedEntryIds.has(entry.id));

      deleteSelectedBtn.classList.toggle('visible', hasSelection);
      selectAllBtn.classList.toggle('visible', list.length > 0);
      selectAllBtn.textContent = allSelected ? 'Deseleccionar todas' : 'Seleccionar todas';
      deleteCurrentBtn.classList.toggle('visible', selectedEntryIds.size === 1);

      document.querySelectorAll('.delete-entry-btn').forEach(button => {
        const shouldShow = selectedEntryIds.has(button.dataset.entryId);
        button.classList.toggle('visible', shouldShow);
      });
    }

    function renderEntriesList() {
      const list = notes[activeKey] || [];
      entriesList.innerHTML = '';

      if (!list.length) {
        entriesList.innerHTML = '<div class="entry-row"><button class="entry-item" type="button"><strong>Sin entradas</strong><small>Haz clic en “Nueva” para crear una.</small></button></div>';
        updateDeleteControls();
        return;
      }

      list.forEach(entry => {
        const row = document.createElement('div');
        row.className = `entry-row${entry.id === activeEntryId ? ' active' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = selectedEntryIds.has(entry.id);
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            selectedEntryIds.add(entry.id);
          } else {
            selectedEntryIds.delete(entry.id);
          }
          updateDeleteControls();
        });

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'entry-item';
        btn.innerHTML = `<span>${entry.title || 'Sin título'}</span><small>${(entry.text || '').slice(0, 50) || 'Sin texto aún'}</small>`;
        btn.addEventListener('click', () => {
          loadEntry(activeKey, entry.id);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-entry-btn';
        deleteBtn.dataset.entryId = entry.id;
        deleteBtn.textContent = 'Borrar';
        deleteBtn.addEventListener('click', (event) => {
          event.stopPropagation();
          deleteEntryById(entry.id);
        });

        row.appendChild(checkbox);
        row.appendChild(btn);
        row.appendChild(deleteBtn);
        entriesList.appendChild(row);
      });

      updateDeleteControls();
    }

    function save(silent = false) {
      const list = notes[activeKey] || [];
      const cleanTitle = (title.value || '').trim() || 'Sin título';

      if (!activeEntryId) {
        const newEntry = {
          id: makeId(activeKey),
          title: cleanTitle,
          text: note.value,
          createdAt: Date.now()
        };
        notes[activeKey] = [...list, newEntry];
        activeEntryId = newEntry.id;
      } else {
        notes[activeKey] = list.map(entry => {
          if (entry.id !== activeEntryId) return entry;
          return {
            ...entry,
            title: cleanTitle,
            text: note.value,
            createdAt: entry.createdAt || Date.now()
          };
        });
      }

      saveList();
      renderEntriesList();
      status.textContent = 'Guardado local automático ✓';

      if (!silent) {
        playTone('save');
        showToast('Guardado ✓');
      }
    }

    function deleteEntryById(entryId) {
      const list = notes[activeKey] || [];
      const entry = list.find(item => item.id === entryId);
      if (!entry) return;

      openDeleteModal(`¿Estás seguro de que quieres borrar la nota "${entry.title || 'Sin título'}"?`, () => {
        notes[activeKey] = list.filter(item => item.id !== entryId);
        selectedEntryIds.delete(entryId);

        if (activeEntryId === entryId) {
          const nextEntry = notes[activeKey][0] || null;
          activeEntryId = nextEntry ? nextEntry.id : null;

          if (nextEntry) {
            title.value = nextEntry.title || categoryLabels[activeKey];
            note.value = nextEntry.text || '';
          } else {
            title.value = categoryLabels[activeKey];
            note.value = '';
          }
          updateCounter();
        }

        saveList();
        renderEntriesList();
        status.textContent = 'Nota eliminada ✓';
        playTone('clear');
        showToast('Nota eliminada ✓');
      });
    }

    function autosave() {
      status.textContent = 'Guardando…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => save(true), 450);
    }

    function loadEntry(key, entryId) {
      if (activeEntryId) {
        save(true);
      }
      activeKey = key;
      selectedEntryIds.clear();
      const list = notes[key] || [];
      const entry = list.find(item => item.id === entryId) || list[0] || {
        id: makeId(key),
        title: categoryLabels[key],
        text: ''
      };

      activeEntryId = entry.id;
      title.value = entry.title || categoryLabels[key];
      note.value = entry.text || '';
      updateCounter();

      document.querySelectorAll('.soft-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.note === key);
      });

      renderEntriesList();
      editorCard.classList.remove('pop');
      void editorCard.offsetWidth;
      editorCard.classList.add('pop');
      playTone('switch');
    }

    function loadNote(key) {
      loadEntry(key, (notes[key] || [])[0]?.id || null);
    }

    document.querySelectorAll('.soft-btn').forEach(btn => {
      btn.addEventListener('click', () => loadNote(btn.dataset.note));
    });

    document.getElementById('saveBtn').addEventListener('click', () => save());

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(`${title.value}\n\n${note.value}`);
        playTone('tap');
        showToast('Copiado al portapapeles');
      } catch {
        showToast('No se pudo copiar');
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      note.value = '';
      updateCounter();
      autosave();
      playTone('clear');
      showToast('Nota limpiada');
    });

    deleteCurrentBtn.addEventListener('click', () => {
      const selected = [...selectedEntryIds];
      if (selected.length !== 1) {
        showToast('Selecciona solo una nota');
        return;
      }
      deleteEntryById(selected[0]);
    });

    selectAllBtn.addEventListener('click', () => {
      const list = notes[activeKey] || [];
      const allSelected = list.length > 0 && list.every(entry => selectedEntryIds.has(entry.id));

      if (allSelected) {
        selectedEntryIds.clear();
      } else {
        list.forEach(entry => selectedEntryIds.add(entry.id));
      }

      renderEntriesList();
    });

    deleteSelectedBtn.addEventListener('click', () => {
      const ids = [...selectedEntryIds];
      if (!ids.length) {
        showToast('Selecciona una o más notas');
        return;
      }

      openDeleteModal(`¿Estás seguro de que quieres borrar ${ids.length} nota(s) seleccionada(s)?`, () => {
        notes[activeKey] = (notes[activeKey] || []).filter(entry => !ids.includes(entry.id));
        selectedEntryIds.clear();

        const nextEntry = notes[activeKey][0] || null;
        activeEntryId = nextEntry ? nextEntry.id : null;
        if (nextEntry) {
          title.value = nextEntry.title || categoryLabels[activeKey];
          note.value = nextEntry.text || '';
        } else {
          title.value = categoryLabels[activeKey];
          note.value = '';
        }
        updateCounter();
        saveList();
        renderEntriesList();
        status.textContent = 'Entradas eliminadas ✓';
        playTone('clear');
        showToast('Entradas eliminadas ✓');
      });
    });

    cancelDeleteBtn.addEventListener('click', closeDeleteModal);
    confirmDeleteBtn.addEventListener('click', () => {
      if (typeof pendingDeleteAction === 'function') {
        pendingDeleteAction();
      }
      closeDeleteModal();
    });
    deleteModal.addEventListener('click', (event) => {
      if (event.target === deleteModal) {
        closeDeleteModal();
      }
    });

    document.getElementById('newBtn').addEventListener('click', () => {
      const list = notes[activeKey] || [];
      const newEntry = {
        id: makeId(activeKey),
        title: `Nueva ${categoryLabels[activeKey] || 'entrada'}`,
        text: '',
        createdAt: Date.now()
      };

      notes[activeKey] = [...list, newEntry];
      activeEntryId = newEntry.id;
      title.value = newEntry.title;
      note.value = '';
      updateCounter();
      renderEntriesList();
      saveList();
      note.focus();
      playTone('tap');
      showToast('Lista para escribir ✨');
    });

    soundBtn.addEventListener('click', () => {
      soundsEnabled = !soundsEnabled;
      soundBtn.textContent = soundsEnabled ? '🔊 Sonidos: sí' : '🔇 Sonidos: no';
      if (soundsEnabled) playTone('tap');
    });

    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('bloc-bonito-theme');

    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.body.classList.toggle('dark', dark);
      themeToggle.textContent = dark ? '☀️ Claro' : '🌙 Oscuro';
      themeToggle.setAttribute('aria-pressed', String(dark));
      localStorage.setItem('bloc-bonito-theme', dark ? 'dark' : 'light');
    }

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(nextTheme);
      playTone('tap');
    });

    applyTheme(savedTheme === 'dark' ? 'dark' : 'light');

    [title, note].forEach(el => el.addEventListener('input', () => {
      updateCounter();
      autosave();
    }));

    note.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = note.selectionStart;
        const end = note.selectionEnd;
        note.value = note.value.substring(0, start) + '  ' + note.value.substring(end);
        note.selectionStart = note.selectionEnd = start + 2;
        autosave();
      }
    });

    loadNote(activeKey);
  </script>
</body>
</html>
