<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Bloc Bonito</title>
  <style>
    :root{
      --bg:#f7efd2;
      --panel:#fffdf4;
      --ink:#5d554d;
      --muted:#8f8579;
      --green:#8bc7a8;
      --green-dark:#5da783;
      --yellow:#f4cf72;
      --pink:#efadad;
      --blue:#9ecfe4;
      --cream:#fff8df;
      --shadow:0 12px 30px rgba(91, 76, 58, .16);
      --shadow-soft:0 7px 0 rgba(91, 76, 58, .10);
      --radius:28px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.7) 0 4%, transparent 4.2%),
        radial-gradient(circle at 82% 18%, rgba(255,255,255,.55) 0 3%, transparent 3.2%),
        linear-gradient(180deg, #e8f0c8 0%, #f8edca 52%, #efdcae 100%);
      overflow-x:hidden;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      z-index:-1;
      border-radius:50%;
      filter:blur(2px);
      opacity:.55;
    }

    body::before{
      width:320px;
      height:320px;
      left:-110px;
      top:90px;
      background:#c7dfad;
    }

    body::after{
      width:360px;
      height:360px;
      right:-150px;
      bottom:-60px;
      background:#f3caa6;
    }

    .app{
      width:min(1100px, calc(100% - 28px));
      margin:34px auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo{
      width:58px;
      height:58px;
      border-radius:20px 20px 24px 24px;
      display:grid;
      place-items:center;
      background:var(--yellow);
      box-shadow:var(--shadow-soft);
      transform:rotate(-3deg);
      font-size:29px;
    }

    h1{
      margin:0;
      font-size:clamp(1.55rem, 4vw, 2.4rem);
      letter-spacing:-.04em;
    }

    .subtitle{
      color:var(--muted);
      font-size:.95rem;
      margin-top:3px;
    }

    .status{
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(12px);
      padding:10px 14px;
      border-radius:999px;
      box-shadow:0 4px 14px rgba(90,70,50,.09);
      font-size:.88rem;
      white-space:nowrap;
    }

    .shell{
      display:grid;
      grid-template-columns:240px 1fr;
      gap:18px;
      background:rgba(255,255,255,.28);
      border:1px solid rgba(255,255,255,.5);
      padding:14px;
      border-radius:36px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
    }

    .sidebar,
    .editor-card{
      background:var(--panel);
      border-radius:var(--radius);
      box-shadow:inset 0 0 0 2px rgba(117,96,74,.05);
    }

    .sidebar{
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .section-title{
      font-size:.8rem;
      text-transform:uppercase;
      letter-spacing:.11em;
      color:var(--muted);
      margin:4px 4px 1px;
      font-weight:800;
    }

    button{
      border:0;
      font:inherit;
      color:var(--ink);
      cursor:pointer;
      user-select:none;
    }

    .soft-btn,
    .action-btn{
      border-radius:18px;
      min-height:48px;
      padding:11px 14px;
      font-weight:800;
      transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
      box-shadow:0 5px 0 rgba(93,85,77,.11);
    }

    .soft-btn{
      text-align:left;
      background:#f1ead9;
    }

    .soft-btn:hover,
    .action-btn:hover{
      transform:translateY(-2px);
      filter:brightness(1.02);
    }

    .soft-btn:active,
    .action-btn:active{
      transform:translateY(3px) scale(.98);
      box-shadow:0 2px 0 rgba(93,85,77,.10);
    }

    .soft-btn.active{
      background:#dcebd3;
      outline:3px solid rgba(93,167,131,.18);
    }

    .editor-card{
      padding:22px;
      min-height:600px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .entries-panel{
      background:#f6f2e8;
      border:1px solid rgba(117,96,74,.10);
      border-radius:20px;
      padding:10px;
    }

    .entries-panel h3{
      margin:0 0 10px;
      font-size:.82rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .entries-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
    }

    .entries-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:220px;
      overflow:auto;
    }

    .entry-row{
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,.55);
      border:1px solid rgba(117,96,74,.08);
      border-radius:14px;
      padding:6px 8px;
    }

    .entry-row.active{
      background:#dcebd3;
      outline:2px solid rgba(93,167,131,.2);
    }

    .entry-row input[type="checkbox"] {
      width:16px;
      height:16px;
      accent-color: var(--green-dark);
      cursor:pointer;
      flex-shrink:0;
    }

    .entry-item{
      flex:1;
      width:100%;
      text-align:left;
      border:0;
      background:transparent;
      padding:8px 6px;
      font-weight:800;
      color:var(--ink);
      cursor:pointer;
    }

    .entry-item small{
      display:block;
      color:var(--muted);
      font-size:.72rem;
      margin-top:4px;
      font-weight:700;
    }

    .delete-entry-btn,
    .delete-selected-btn,
    .select-all-btn,
    #deleteCurrentBtn {
      display:none;
      border-radius:12px;
      padding:7px 10px;
      background:#f4c5c0;
      font-size:.76rem;
      font-weight:800;
      box-shadow:none;
    }

    .delete-entry-btn.visible,
    .delete-selected-btn.visible,
    .select-all-btn.visible,
    #deleteCurrentBtn.visible {
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .delete-selected-btn,
    .select-all-btn {
      min-height:32px;
      padding:7px 12px;
      background:#efadad;
    }

    .entries-header-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:6px;
    }

    .action-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      background:#eee7d7;
    }

    .action-btn.green{ background:#b9dec9; }
    .action-btn.yellow{ background:#f7dc92; }
    .action-btn.pink{ background:#f4c5c0; }
    .action-btn.blue{ background:#c8e3ed; }

    .title-input{
      border:0;
      outline:0;
      width:100%;
      padding:8px 6px 10px;
      background:transparent;
      color:var(--ink);
      font:800 clamp(1.45rem, 3vw, 2rem)/1.2 "Trebuchet MS", sans-serif;
    }

    .divider{
      height:3px;
      border-radius:999px;
      background:
        repeating-linear-gradient(90deg, #d8cdb7 0 18px, transparent 18px 26px);
      margin:4px 0 12px;
      opacity:.75;
    }

    textarea{
      width:100%;
      flex:1;
      min-height:410px;
      resize:none;
      border:0;
      outline:0;
      padding:14px 8px;
      color:var(--ink);
      background:
        repeating-linear-gradient(
          transparent 0,
          transparent 31px,
          rgba(139,199,168,.18) 32px,
          rgba(139,199,168,.18) 33px
        );
      font:500 1.04rem/33px "Trebuchet MS", "Segoe UI", sans-serif;
      caret-color:var(--green-dark);
    }

    .bottom-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:14px;
      color:var(--muted);
      font-size:.88rem;
    }

    .sound-toggle{
      border-radius:999px;
      padding:9px 13px;
      background:#eee7d7;
      font-weight:800;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translate(-50%, 25px) scale(.96);
      opacity:0;
      pointer-events:none;
      padding:13px 18px;
      border-radius:18px;
      background:#5f6655;
      color:white;
      font-weight:800;
      box-shadow:0 10px 28px rgba(0,0,0,.2);
      transition:.25s ease;
      z-index:10;
    }

    .toast.show{
      transform:translate(-50%, 0) scale(1);
      opacity:1;
    }

    .modal-backdrop {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(72, 62, 52, 0.38);
      backdrop-filter:blur(4px);
      opacity:0;
      visibility:hidden;
      transition:opacity .2s ease, visibility .2s ease;
      z-index:20;
    }

    .modal-backdrop.show {
      opacity:1;
      visibility:visible;
    }

    .modal-card {
      width:min(420px, calc(100% - 28px));
      background:var(--panel);
      border-radius:28px;
      box-shadow:0 20px 45px rgba(72, 62, 52, 0.22);
      border:1px solid rgba(117,96,74,.10);
      padding:22px 20px 18px;
      transform:translateY(10px) scale(.98);
      transition:transform .2s ease;
    }

    .modal-backdrop.show .modal-card {
      transform:translateY(0) scale(1);
    }

    .modal-card h2 {
      margin:0 0 10px;
      font-size:1.5rem;
      letter-spacing:-.04em;
    }

    .modal-card p {
      margin:0 0 18px;
      color:var(--muted);
      line-height:1.6;
    }

    .modal-actions {
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }

    .modal-btn {
      border-radius:16px;
      min-height:42px;
      padding:9px 16px;
      font-weight:800;
      box-shadow:0 4px 0 rgba(93,85,77,.10);
    }

    .modal-btn.cancel {
      background:#eee7d7;
    }

    .modal-btn.confirm {
      background:#f4c5c0;
    }

    .pop{
      animation:pop .28s ease;
    }

    @keyframes pop{
      0%{ transform:scale(.95); }
      55%{ transform:scale(1.025); }
      100%{ transform:scale(1); }
    }

    @media (max-width:780px){
      .topbar{
        align-items:flex-start;
        flex-direction:column;
      }

      .shell{
        grid-template-columns:1fr;
      }

      .sidebar{
        flex-direction:row;
        flex-wrap:wrap;
      }

      .section-title{
        width:100%;
      }

      .soft-btn{
        flex:1 1 140px;
      }

      .editor-card{
        min-height:560px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">✎</div>
        <div>
          <h1>Bloc's</h1>
          <div class="subtitle">Un sitio tranquilo para tus ideas.</div>
        </div>
      </div>
      <div class="status" id="status">Guardado local automático ✓</div>
    </header>

    <section class="shell">
      <aside class="sidebar">
        <div class="section-title">Notas</div>
        <button class="soft-btn active" data-note="principal">🌿 Principal</button>
        <button class="soft-btn" data-note="diario">☀ Diario</button>
        <button class="soft-btn" data-note="ideas">💡 Ideas</button>
        <button class="soft-btn" data-note="pendientes">✓ Pendientes</button>
      </aside>

      <section class="editor-card" id="editorCard">
        <div class="toolbar">
          <button class="action-btn green" id="newBtn">＋ Nueva</button>
          <button class="action-btn yellow" id="saveBtn">💾 Guardar</button>
          <button class="action-btn blue" id="copyBtn">⧉ Copiar</button>
          <button class="action-btn pink" id="clearBtn">⌫ Limpiar</button>
          <button class="action-btn pink" id="deleteCurrentBtn">🗑 Borrar nota</button>
        </div>

        <div class="entries-panel">
          <div class="entries-header">
            <h3>Entradas</h3>
            <div class="entries-header-actions">
              <button class="select-all-btn" id="selectAllBtn" type="button">Seleccionar todas</button>
              <button class="delete-selected-btn" id="deleteSelectedBtn" type="button">🗑 Seleccionadas</button>
            </div>
          </div>
          <div class="entries-list" id="entriesList"></div>
        </div>

        <input class="title-input" id="title" value="Nota principal" aria-label="Título de la nota"/>
        <div class="divider"></div>
        <textarea id="note" spellcheck="true" placeholder="Escribe algo bonito aquí..."></textarea>

        <div class="bottom-row">
          <span id="counter">0 caracteres</span>
          <button class="sound-toggle" id="soundBtn">🔊 Sonidos: sí</button>
        </div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop" id="deleteModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <h2 id="deleteModalTitle">¿Borrar nota?</h2>
      <p id="deleteModalText">Estás a punto de eliminar esta entrada.</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="cancelDeleteBtn" type="button">Cancelar</button>
        <button class="modal-btn confirm" id="confirmDeleteBtn" type="button">Sí, borrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Guardado ✓</div>

  <script>
    const title = document.getElementById('title');
    const note = document.getElementById('note');
    const counter = document.getElementById('counter');
    const toast = document.getElementById('toast');
    const status = document.getElementById('status');
    const editorCard = document.getElementById('editorCard');
    const soundBtn = document.getElementById('soundBtn');
    const entriesList = document.getElementById('entriesList');
    const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const deleteModal = document.getElementById('deleteModal');
    const deleteModalText = document.getElementById('deleteModalText');
    const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
    const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

    let activeKey = 'principal';
    let activeEntryId = null;
    let soundsEnabled = true;
    let saveTimer;
    const selectedEntryIds = new Set();
    let pendingDeleteAction = null;

    const categoryLabels = {
      principal: 'Principal',
      diario: 'Diario',
      ideas: 'Ideas',
      pendientes: 'Pendientes'
    };

    const defaults = {
      principal: [
        { id: 'principal-1', title: 'Nota principal', text: '' }
      ],
      diario: [
        { id: 'diario-1', title: 'Diario', text: '' }
      ],
      ideas: [
        { id: 'ideas-1', title: 'Ideas', text: '' }
      ],
      pendientes: [
        { id: 'pendientes-1', title: 'Pendientes', text: '' }
      ]
    };

    function makeId(prefix) {
      if (window.crypto && crypto.randomUUID) {
        return `${prefix}-${crypto.randomUUID()}`;
      }
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    const loadAll = () => {
      try {
        const raw = JSON.parse(localStorage.getItem('bloc-bonito-notes'));
        if (!raw) return structuredClone(defaults);

        const normalized = {};
        Object.keys(defaults).forEach(key => {
          const value = raw[key];
          if (Array.isArray(value)) {
            normalized[key] = value.map((entry, index) => ({
              id: entry.id || makeId(key),
              title: entry.title || `${categoryLabels[key]} ${index + 1}`,
              text: entry.text || '',
              createdAt: entry.createdAt || Date.now()
            }));
          } else if (value && typeof value === 'object') {
            normalized[key] = [{
              id: makeId(key),
              title: value.title || categoryLabels[key],
              text: value.text || '',
              createdAt: Date.now()
            }];
          } else {
            normalized[key] = [...defaults[key]];
          }
        });

        return normalized;
      } catch {
        return structuredClone(defaults);
      }
    };

    let notes = loadAll();

    function playTone(type = 'tap') {
      if (!soundsEnabled) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const frequencies = {
        tap: [520, 660],
        save: [660, 880],
        clear: [320, 240],
        switch: [440, 560]
      };

      const pair = frequencies[type] || frequencies.tap;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(pair[0], ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(pair[1], ctx.currentTime + 0.09);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.065, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.13);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.14);
      osc.onended = () => ctx.close();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function openDeleteModal(message, callback) {
      deleteModalText.textContent = message;
      pendingDeleteAction = callback;
      deleteModal.classList.add('show');
      deleteModal.setAttribute('aria-hidden', 'false');
    }

    function closeDeleteModal() {
      deleteModal.classList.remove('show');
      deleteModal.setAttribute('aria-hidden', 'true');
      pendingDeleteAction = null;
    }

    function updateCounter() {
      counter.textContent = `${note.value.length} caracteres`;
    }

    function saveList() {
      localStorage.setItem('bloc-bonito-notes', JSON.stringify(notes));
    }

    function updateDeleteControls() {
      const list = notes[activeKey] || [];
      const hasSelection = selectedEntryIds.size > 0;
      const allSelected = list.length > 0 && list.every(entry => selectedEntryIds.has(entry.id));

      deleteSelectedBtn.classList.toggle('visible', hasSelection);
      selectAllBtn.classList.toggle('visible', list.length > 0);
      selectAllBtn.textContent = allSelected ? 'Deseleccionar todas' : 'Seleccionar todas';
      deleteCurrentBtn.classList.toggle('visible', selectedEntryIds.size === 1);

      document.querySelectorAll('.delete-entry-btn').forEach(button => {
        const shouldShow = selectedEntryIds.has(button.dataset.entryId);
        button.classList.toggle('visible', shouldShow);
      });
    }

    function renderEntriesList() {
      const list = notes[activeKey] || [];
      entriesList.innerHTML = '';

      if (!list.length) {
        entriesList.innerHTML = '<div class="entry-row"><button class="entry-item" type="button"><strong>Sin entradas</strong><small>Haz clic en “Nueva” para crear una.</small></button></div>';
        updateDeleteControls();
        return;
      }

      list.forEach(entry => {
        const row = document.createElement('div');
        row.className = `entry-row${entry.id === activeEntryId ? ' active' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = selectedEntryIds.has(entry.id);
        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            selectedEntryIds.add(entry.id);
          } else {
            selectedEntryIds.delete(entry.id);
          }
          updateDeleteControls();
        });

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'entry-item';
        btn.innerHTML = `<span>${entry.title || 'Sin título'}</span><small>${(entry.text || '').slice(0, 50) || 'Sin texto aún'}</small>`;
        btn.addEventListener('click', () => {
          loadEntry(activeKey, entry.id);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-entry-btn';
        deleteBtn.dataset.entryId = entry.id;
        deleteBtn.textContent = 'Borrar';
        deleteBtn.addEventListener('click', (event) => {
          event.stopPropagation();
          deleteEntryById(entry.id);
        });

        row.appendChild(checkbox);
        row.appendChild(btn);
        row.appendChild(deleteBtn);
        entriesList.appendChild(row);
      });

      updateDeleteControls();
    }

    function save(silent = false) {
      const list = notes[activeKey] || [];
      const cleanTitle = (title.value || '').trim() || 'Sin título';

      if (!activeEntryId) {
        const newEntry = {
          id: makeId(activeKey),
          title: cleanTitle,
          text: note.value,
          createdAt: Date.now()
        };
        notes[activeKey] = [...list, newEntry];
        activeEntryId = newEntry.id;
      } else {
        notes[activeKey] = list.map(entry => {
          if (entry.id !== activeEntryId) return entry;
          return {
            ...entry,
            title: cleanTitle,
            text: note.value,
            createdAt: entry.createdAt || Date.now()
          };
        });
      }

      saveList();
      renderEntriesList();
      status.textContent = 'Guardado local automático ✓';

      if (!silent) {
        playTone('save');
        showToast('Guardado ✓');
      }
    }

    function deleteEntryById(entryId) {
      const list = notes[activeKey] || [];
      const entry = list.find(item => item.id === entryId);
      if (!entry) return;

      openDeleteModal(`¿Estás seguro de que quieres borrar la nota "${entry.title || 'Sin título'}"?`, () => {
        notes[activeKey] = list.filter(item => item.id !== entryId);
        selectedEntryIds.delete(entryId);

        if (activeEntryId === entryId) {
          const nextEntry = notes[activeKey][0] || null;
          activeEntryId = nextEntry ? nextEntry.id : null;

          if (nextEntry) {
            title.value = nextEntry.title || categoryLabels[activeKey];
            note.value = nextEntry.text || '';
          } else {
            title.value = categoryLabels[activeKey];
            note.value = '';
          }
          updateCounter();
        }

        saveList();
        renderEntriesList();
        status.textContent = 'Nota eliminada ✓';
        playTone('clear');
        showToast('Nota eliminada ✓');
      });
    }

    function autosave() {
      status.textContent = 'Guardando…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => save(true), 450);
    }

    function loadEntry(key, entryId) {
      save(true);
      activeKey = key;
      selectedEntryIds.clear();
      const list = notes[key] || [];
      const entry = list.find(item => item.id === entryId) || list[0] || {
        id: makeId(key),
        title: categoryLabels[key],
        text: ''
      };

      activeEntryId = entry.id;
      title.value = entry.title || categoryLabels[key];
      note.value = entry.text || '';
      updateCounter();

      document.querySelectorAll('.soft-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.note === key);
      });

      renderEntriesList();
      editorCard.classList.remove('pop');
      void editorCard.offsetWidth;
      editorCard.classList.add('pop');
      playTone('switch');
    }

    function loadNote(key) {
      loadEntry(key, (notes[key] || [])[0]?.id || null);
    }

    document.querySelectorAll('.soft-btn').forEach(btn => {
      btn.addEventListener('click', () => loadNote(btn.dataset.note));
    });

    document.getElementById('saveBtn').addEventListener('click', () => save());

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(`${title.value}\n\n${note.value}`);
        playTone('tap');
        showToast('Copiado al portapapeles');
      } catch {
        showToast('No se pudo copiar');
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      note.value = '';
      updateCounter();
      autosave();
      playTone('clear');
      showToast('Nota limpiada');
    });

    deleteCurrentBtn.addEventListener('click', () => {
      const selected = [...selectedEntryIds];
      if (selected.length !== 1) {
        showToast('Selecciona solo una nota');
        return;
      }
      deleteEntryById(selected[0]);
    });

    selectAllBtn.addEventListener('click', () => {
      const list = notes[activeKey] || [];
      const allSelected = list.length > 0 && list.every(entry => selectedEntryIds.has(entry.id));

      if (allSelected) {
        selectedEntryIds.clear();
      } else {
        list.forEach(entry => selectedEntryIds.add(entry.id));
      }

      renderEntriesList();
    });

    deleteSelectedBtn.addEventListener('click', () => {
      const ids = [...selectedEntryIds];
      if (!ids.length) {
        showToast('Selecciona una o más notas');
        return;
      }

      openDeleteModal(`¿Estás seguro de que quieres borrar ${ids.length} nota(s) seleccionada(s)?`, () => {
        notes[activeKey] = (notes[activeKey] || []).filter(entry => !ids.includes(entry.id));
        selectedEntryIds.clear();

        const nextEntry = notes[activeKey][0] || null;
        activeEntryId = nextEntry ? nextEntry.id : null;
        if (nextEntry) {
          title.value = nextEntry.title || categoryLabels[activeKey];
          note.value = nextEntry.text || '';
        } else {
          title.value = categoryLabels[activeKey];
          note.value = '';
        }
        updateCounter();
        saveList();
        renderEntriesList();
        status.textContent = 'Entradas eliminadas ✓';
        playTone('clear');
        showToast('Entradas eliminadas ✓');
      });
    });

    cancelDeleteBtn.addEventListener('click', closeDeleteModal);
    confirmDeleteBtn.addEventListener('click', () => {
      if (typeof pendingDeleteAction === 'function') {
        pendingDeleteAction();
      }
      closeDeleteModal();
    });
    deleteModal.addEventListener('click', (event) => {
      if (event.target === deleteModal) {
        closeDeleteModal();
      }
    });

    document.getElementById('newBtn').addEventListener('click', () => {
      const list = notes[activeKey] || [];
      const newEntry = {
        id: makeId(activeKey),
        title: `Nueva ${categoryLabels[activeKey] || 'entrada'}`,
        text: '',
        createdAt: Date.now()
      };

      notes[activeKey] = [...list, newEntry];
      activeEntryId = newEntry.id;
      title.value = newEntry.title;
      note.value = '';
      updateCounter();
      renderEntriesList();
      saveList();
      note.focus();
      playTone('tap');
      showToast('Lista para escribir ✨');
    });

    soundBtn.addEventListener('click', () => {
      soundsEnabled = !soundsEnabled;
      soundBtn.textContent = soundsEnabled ? '🔊 Sonidos: sí' : '🔇 Sonidos: no';
      if (soundsEnabled) playTone('tap');
    });

    [title, note].forEach(el => el.addEventListener('input', () => {
      updateCounter();
      autosave();
    }));

    note.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = note.selectionStart;
        const end = note.selectionEnd;
        note.value = note.value.substring(0, start) + '  ' + note.value.substring(end);
        note.selectionStart = note.selectionEnd = start + 2;
        autosave();
      }
    });

    loadNote(activeKey);
  </script>
</body>
</html>
